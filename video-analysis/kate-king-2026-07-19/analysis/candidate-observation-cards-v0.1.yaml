cards:
  - id: kate-king-generation-unit-not-story-summary
    status: candidate_observation
    topic: 生成单元提示词结构
    observation: "可见案例反复把参考资产、人物关系、镜头序列、动作和结束状态写在同一生成输入中，而不是只提供故事梗概。"
    source_videos: [video-001, video-002, video-003, video-008]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    promote_after:
      - "核对代表性原始 Prompt 文本"
      - "通过内部多镜头生成测试"
  - id: kate-king-one-request-multiple-artistic-shots
    status: candidate_observation
    topic: 单次生成多艺术分镜
    observation: "多个展示片段在一个连续结果中包含清晰建立镜头、近景、特写、反打和收束镜头。"
    source_videos: [video-003, video-004, video-005, video-007]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    caution: "展示视频没有公开原始 Provider 请求日志，仍需内部 payload 证据确认是否单次生成。"
    promote_after:
      - "绑定真实 Provider run 与 payload"
  - id: kate-king-reference-order-and-role
    status: candidate_observation
    topic: 参考资产绑定
    observation: "Prompt 卡旁反复显示有序人物参考缩略图，人物组合变化时结果中的角色组合也随之变化。"
    source_videos: [video-009, video-010, video-012, video-015]
    evidence_type: dense_frame_visual_analysis
    confidence: medium
    caution: "界面缩略图顺序与真实 payload 顺序尚未由请求日志验证。"
    promote_after:
      - "获取请求 payload 或内部复现"
  - id: kate-king-dialogue-reaction-order
    status: candidate_observation
    topic: 对白表演节拍
    observation: "双人对白案例通过发起者、听者反应、回应和关系收束的顺序形成可读表演，而不是只依赖抽象情绪。"
    source_videos: [video-001, video-002, video-008, video-015]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    promote_after:
      - "与原始分镜或 Prompt 连续引用核验"
  - id: kate-king-micro-action-as-relationship-proof
    status: candidate_observation
    topic: 微动作与关系表达
    observation: "递物、接住、整理围巾、触碰、回望和拥抱等微动作被用作关系变化的可见证据。"
    source_videos: [video-004, video-005, video-006, video-013]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    promote_after:
      - "形成按关系阶段分类的内部测试样本"
  - id: kate-king-cinematic-look-specific-design
    status: candidate_observation
    topic: 类型片视觉系统
    observation: "黑白悬疑案例的效果由高反差动机光、雨地反射、剪影、物件特写和信息释放顺序共同形成。"
    source_videos: [video-007]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    caution: "单一案例，只能证明该组合在展示片中存在。"
    promote_after:
      - "补充其他类型片案例和内部复现"
  - id: kate-king-action-needs-phase-and-ownership
    status: candidate_observation
    topic: 动作相位与道具归属
    observation: "持剑对峙案例把人物站位、武器特写、拔剑和双人出口状态分成可读相位。"
    source_videos: [video-010]
    evidence_type: dense_frame_visual_analysis
    confidence: medium
    promote_after:
      - "核对 Prompt 文本中的方向、接触和受力字段"
      - "执行复杂动作内部测试"
  - id: kate-king-storyboard-not-universal-gate
    status: candidate_observation
    topic: 视觉锚点策略
    observation: "可见案例既有多参考图和多镜头 Prompt，也有单人物参考驱动的连续镜头，因此视觉锚点应按风险选择。"
    source_videos: [video-003, video-009, video-014, video-016]
    evidence_type: dense_frame_visual_analysis
    confidence: medium
    caution: "无法从录屏确定幕后是否另有未展示故事板。"
    promote_after:
      - "通过内部流程记录确认实际输入资产"
  - id: kate-king-compilation-is-not-one-run
    status: candidate_observation
    topic: 证据边界
    observation: "部分长视频明确由多个不同角色、参考组合和场景片段汇编，不能把展示视频误判为一次模型请求。"
    source_videos: [video-008, video-012, video-014, video-015, video-016]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    promote_after:
      - "保留该证据边界并写入成片审阅规则"
  - id: kate-king-provider-claims-unverified
    status: candidate_observation
    topic: 模型能力证据
    observation: "界面中的模型名、版本和展示结果只能作为来源陈述，不能替代 Provider 官方能力表或内部 run 证据。"
    source_videos: [video-002, video-003, video-012, video-014]
    evidence_type: dense_frame_visual_analysis
    confidence: high
    promote_after:
      - "与官方模型资料和内部 payload/result 交叉验证"

duplicate_groups: []
